<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>광고 소재</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { overflow: hidden; }
  body { background: #ddd; font-family: "Pretendard", -apple-system, "Apple SD Gothic Neo", sans-serif; }
  .ad { width: 1080px; height: 1080px; position: relative; overflow: hidden; margin-bottom: 40px; }
  .ad h1 { position: absolute; left: 80px; top: 90px; font-size: 92px; line-height: 1.22; letter-spacing: -0.03em; font-weight: 800; color: #222; }
  .ad h1 em { font-style: normal; color: #ff4f7b; }
  .ad p { position: absolute; left: 84px; top: 440px; font-size: 40px; color: #555; font-weight: 600; }
  .ad img { position: absolute; right: 60px; bottom: 60px; width: 540px; border-radius: 40px; }
  .ad .tag { position: absolute; left: 80px; bottom: 90px; background: #222; color: #fff; font-size: 38px; font-weight: 700; padding: 18px 30px; border-radius: 999px; }
  #a { background: #fff2f5; }
  #b { background: #f4f1ec; }
  #b .tag { background: #ff4f7b; }
</style>
</head>
<body>
  <!-- A안: 육아·어린이집 준비물 -->
  <div class="ad" id="a">
    <h1>어린이집 이름표,<br><em>아직도 손으로</em><br>쓰세요?</h1>
    <p>폰으로 쓰고 3초 만에 출력</p>
    <img src="https://thumbnail.coupangcdn.com/thumbnails/remote/640x640ex/image/vendor_inventory/e8f9/a0703e42dcd726aef299748f42f322c7438ba747220cc221c626f15b93ec.png" alt="">
    <div class="tag">★ 4.8 · 리뷰 8천+</div>
  </div>
  <!-- B안: 살림·정리정돈 -->
  <div class="ad" id="b">
    <h1>반찬통·약통·서랍<br><em>라벨 하나로</em><br>정리 끝</h1>
    <p>잉크 없는 감열식 · 19,900원</p>
    <img src="https://thumbnail.coupangcdn.com/thumbnails/remote/640x640ex/image/vendor_inventory/e8f9/a0703e42dcd726aef299748f42f322c7438ba747220cc221c626f15b93ec.png" alt="">
    <div class="tag">★ 4.8 · 리뷰 8천+</div>
  </div>
</body>
</html>
